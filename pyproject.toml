[project]
name = "agent-gainz"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.120.2",
    "openai-agents>=0.19.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
]

[project.scripts]
agent-gainz = "agent_gainz.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "nbstripout>=0.9.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gainz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
